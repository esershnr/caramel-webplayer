<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caramel Webplayer demo</title>
    <meta name="description" content="A themed Video.js 10 player: morphing icons, skip intro / recap / outro / sponsor, chapters, playlist with resume." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/demo.css" />
  </head>
  <body class="caramel-theme">
    <header class="demo-header">
      <a class="demo-brand" href="https://github.com/esershnr/caramel-webplayer">
        <img src="/favicon.svg" alt="" width="28" height="28" />
        <h1 class="caramel-heading">Caramel Webplayer</h1>
      </a>
      <div class="demo-theme" role="group" aria-label="Tema" data-i18n-label="theme">
        <button type="button" data-theme-choice="light" data-i18n="light">Açık</button>
        <button type="button" data-theme-choice="dark" data-i18n="dark">Koyu</button>
        <button type="button" data-theme-choice="system" aria-pressed="true" data-i18n="system">Sistem</button>
        <span class="demo-resolved caramel-tabular" id="resolved-theme"></span>
      </div>
      <div class="demo-theme" role="group" aria-label="Dil" data-i18n-label="language">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="demo-main">
      <div class="demo-stage">
        <media-i18n id="i18n" lang="tr">
          <video-player id="player" class="demo-player"></video-player>
        </media-i18n>
        <caramel-chapters-panel for="player" class="demo-chapters"></caramel-chapters-panel>
      </div>

      <aside class="demo-side">
        <caramel-playlist-panel for="playlist" class="demo-playlist"></caramel-playlist-panel>
        <section class="demo-panel">
          <h2 class="caramel-heading" data-i18n="bands">Zaman çizelgesi bantları</h2>
          <p class="demo-muted" data-i18n="bandsHint">Çizgili bant otomatik atlanır (demo: özet). Önizleme kartı fare bandın üstündeyken türü gösterir.</p>
          <ul class="demo-list demo-legend">
            <li><span class="demo-swatch" data-type="intro"></span><span data-i18n="intro">İntro</span></li>
            <li><span class="demo-swatch" data-type="recap" data-auto></span><span data-i18n="recap">Özet (otomatik atlanır)</span></li>
            <li><span class="demo-swatch" data-type="outro"></span><span data-i18n="outro">Jenerik</span></li>
            <li><span class="demo-swatch" data-type="sponsor"></span>Sponsor</li>
          </ul>
        </section>
        <section class="demo-panel">
          <h2 class="caramel-heading" data-i18n="events">Olaylar</h2>
          <ol id="event-log" class="demo-list demo-log caramel-tabular"></ol>
        </section>
      </aside>
    </main>

    <footer class="demo-footer">
      <a href="https://github.com/esershnr/caramel-webplayer">GitHub</a>
      <a href="https://www.npmjs.com/package/@esershnr/caramel-webplayer">npm</a>
      <span>Video: <a href="https://mango.blender.org">Tears of Steel</a> (CC) Blender Foundation, <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
