<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caramel Webplayer, vanilla demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2712%27 fill=%27%235e3310%27/%3E%3Cpath d=%27M9 7l8 5-8 5z%27 fill=%27%23c9945c%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/demo.css" />
  </head>
  <body class="caramel-theme">
    <header class="demo-header">
      <h1 class="caramel-heading">Player demo (HTML)</h1>
      <div class="demo-theme" role="group" aria-label="Tema">
        <button type="button" data-theme-choice="light">Açık</button>
        <button type="button" data-theme-choice="dark">Koyu</button>
        <button type="button" data-theme-choice="system" aria-pressed="true">Sistem</button>
        <span class="demo-resolved caramel-tabular" id="resolved-theme"></span>
      </div>
      <div class="demo-theme" role="group" aria-label="Dil">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="demo-main">
      <div class="demo-stage">
        <media-i18n id="i18n" lang="tr">
          <video-player id="player" class="demo-player"></video-player>
        </media-i18n>
        <caramel-chapters-panel for="player" class="demo-chapters"></caramel-chapters-panel>
      </div>

      <aside class="demo-side">
        <caramel-playlist-panel for="playlist" class="demo-playlist"></caramel-playlist-panel>
        <section class="demo-panel">
          <h2 class="caramel-heading">Zaman çizelgesi bantları</h2>
          <p class="demo-muted">Çizgili bant otomatik atlanır (demo: özet). Önizleme kartı fare bandın üstündeyken türü gösterir.</p>
          <ul class="demo-list demo-legend">
            <li><span class="demo-swatch" data-type="intro"></span>İntro</li>
            <li><span class="demo-swatch" data-type="recap" data-auto></span>Özet (otomatik atlanır)</li>
            <li><span class="demo-swatch" data-type="outro"></span>Jenerik</li>
            <li><span class="demo-swatch" data-type="sponsor"></span>Sponsor</li>
          </ul>
        </section>
        <section class="demo-panel">
          <h2 class="caramel-heading">Olaylar</h2>
          <ol id="event-log" class="demo-list demo-log caramel-tabular"></ol>
        </section>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
