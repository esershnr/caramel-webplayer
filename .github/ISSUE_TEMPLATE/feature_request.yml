name: Feature request
description: Suggest a new capability or an improvement.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Open questions are better in [Discussions](https://github.com/esershnr/caramel-webplayer/discussions).
        A feature request should describe a concrete problem.
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - '@esershnr/caramel-webplayer'
        - '@esershnr/caramel-theme'
        - '@esershnr/caramel-icons'
        - '@esershnr/caramel-skin'
        - '@esershnr/caramel-skip-segments'
        - '@esershnr/caramel-chapters'
        - '@esershnr/caramel-playlist'
        - 'scripts (gen-thumbs, encode-hls)'
        - New package
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API, attributes, events or UI you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
