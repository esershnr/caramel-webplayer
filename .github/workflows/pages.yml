name: Pages

# Builds the vanilla demo (examples/vanilla) and publishes it to GitHub Pages.
# The Tears of Steel demo media is not committed: tools/tos-demo.mjs downloads
# the source and cuts the clips, and the result is cached until the script
# changes. Repository setting: Pages > Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'examples/vanilla/**'
      - 'packages/**'
      - 'tools/tos-demo.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore demo media
        id: media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/vanilla/public/tos
          key: tos-demo-${{ hashFiles('tools/tos-demo.mjs', 'scripts/gen-thumbs/src/**') }}
      - name: Build demo media
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node tools/tos-demo.mjs

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build demo
        run: pnpm --filter @esershnr/caramel-example-vanilla build
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/vanilla/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
